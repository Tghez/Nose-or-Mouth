<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 320px;
      height: 120px;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    #card {
      position: absolute;
      inset: 0;
      background: rgba(16, 16, 16, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      padding: 14px 40px 18px 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 4px 16px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      animation: cardIn 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                 cardOut 0.35s 1.65s ease-in forwards;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(8px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)  scale(1); }
    }

    @keyframes cardOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(5px); }
    }

    #notif-title {
      font-size: 13px;
      font-weight: 700;
      color: #e5e5e5;
      line-height: 1.3;
    }

    #notif-body {
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.45;
    }

    #progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 0 0 14px 14px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      transform-origin: left;
      border-radius: 0 0 14px 14px;
      animation: drain 2s linear forwards;
    }

    @keyframes drain {
      from { transform: scaleX(1); }
      to   { transform: scaleX(0); }
    }

    #close-btn {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.3);
      font-size: 11px;
      cursor: pointer;
      border-radius: 5px;
      -webkit-app-region: no-drag;
      transition: color 0.1s, background 0.1s;
    }

    #close-btn:hover {
      color: rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <div id="card">
    <button id="close-btn">✕</button>
    <div id="notif-title"></div>
    <div id="notif-body"></div>
    <div id="progress-track">
      <div id="progress-bar"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search)
    const title  = params.get('title') || ''
    const body   = params.get('body')  || ''

    document.getElementById('notif-title').textContent = title
    document.getElementById('notif-body').textContent  = body

    const isMouth = title.toLowerCase().includes('mouth')
    document.getElementById('progress-bar').style.background = isMouth ? '#f59e0b' : '#22c55e'

    function playChime() {
      try {
        const ctx   = new AudioContext()
        const notes = [523.25, 659.25, 783.99]
        notes.forEach((freq, i) => {
          const osc  = ctx.createOscillator()
          const gain = ctx.createGain()
          osc.connect(gain)
          gain.connect(ctx.destination)
          osc.type = 'sine'
          osc.frequency.value = freq
          const t = ctx.currentTime + i * 0.11
          gain.gain.setValueAtTime(0, t)
          gain.gain.linearRampToValueAtTime(0.14, t + 0.025)
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55)
          osc.start(t)
          osc.stop(t + 0.55)
        })
        setTimeout(() => ctx.close(), 1200)
      } catch (_) {}
    }

    playChime()

    document.getElementById('close-btn').addEventListener('click', () => window.close())
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close() })

    setTimeout(() => window.close(), 2000)
  </script>
</body>
</html>
