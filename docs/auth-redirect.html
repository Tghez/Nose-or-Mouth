<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Redirecting...</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    color: #37352f;
    background: #fff;
    text-align: center;
  }
  p { margin: 6px 0; font-size: 14px; }
  strong { font-size: 16px; }
  a { color: #787774; text-decoration: underline; }
</style>
</head>
<body>
  <p><strong>Redirecting to your Mouth Breather app...</strong></p>
  <p><a id="manual-link" href="#">If you weren't redirected, click here.</a></p>
  <script>
    var deepLink = "mouthbreather://auth-callback" + window.location.search;
    document.getElementById("manual-link").href = deepLink;
    window.location.href = deepLink;
  </script>
</body>
</html>
